name: Build Signed APK

on:
  workflow_dispatch: # با این گزینه، توی تب Actions گیت‌هاب یک دکمه Run workflow ظاهر میشه که دستی اجراش می‌کنی

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17' # اگر پروژه‌ت با ورژن دیگه‌ای از جاوا بیلد میشه، این عدد رو تغییر بده (مثلاً 11 یا 21)

    - name: Decode Keystore File
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
        # دقت کن که مسیر app/release.keystore درست باشه. اگر کیستور توی روت پروژه‌ست، فقط بنویس release.keystore

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: My-App-Release-APK
        path: app/build/outputs/apk/release/*.apk
        # اگر فایل AAB می‌خوای، باید دستور رو به bundleRelease تغییر بدی و مسیر رو به app/build/outputs/bundle/release/*.aab تغییر بدی
